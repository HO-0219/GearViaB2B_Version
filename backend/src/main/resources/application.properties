spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]
spring.application.name=b2bgearvia-api
management.endpoints.web.exposure.include=health,metrics,prometheus
management.endpoint.health.show-details=never
management.metrics.tags.application=${spring.application.name}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/b2bgearvia?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:test}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
app.runtime.database.maximum-pool-size=${DB_POOL_MAX_SIZE:20}
app.runtime.database.minimum-idle=${DB_POOL_MIN_IDLE:5}
app.runtime.database.connection-timeout-ms=${DB_POOL_CONNECTION_TIMEOUT_MS:30000}
spring.datasource.hikari.maximum-pool-size=${app.runtime.database.maximum-pool-size}
spring.datasource.hikari.minimum-idle=${app.runtime.database.minimum-idle}
spring.datasource.hikari.connection-timeout=${app.runtime.database.connection-timeout-ms}

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.open-in-view=false
spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=${SPRING_FLYWAY_BASELINE_ON_MIGRATE:false}
spring.flyway.baseline-version=${SPRING_FLYWAY_BASELINE_VERSION:1}
spring.flyway.validate-migration-naming=true

logging.level.org.springframework.web=${LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_WEB:INFO}
logging.level.org.hibernate.SQL=${LOGGING_LEVEL_ORG_HIBERNATE_SQL:INFO}
logging.level.com.teamproject.notification=${LOGGING_LEVEL_COM_TEAMPROJECT_NOTIFICATION:INFO}
logging.file.name=${LOG_FILE:}
logging.logback.rollingpolicy.max-file-size=${LOG_MAX_FILE_SIZE:20MB}
logging.logback.rollingpolicy.max-history=${LOG_MAX_HISTORY:30}
logging.logback.rollingpolicy.total-size-cap=${LOG_TOTAL_SIZE_CAP:1GB}

spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:false}

server.port=${SERVER_PORT:8081}
server.forward-headers-strategy=${SERVER_FORWARD_HEADERS_STRATEGY:framework}
server.tomcat.threads.max=${HTTP_MAX_THREADS:100}
server.tomcat.accept-count=${HTTP_ACCEPT_COUNT:100}

app.frontend-url=${FRONTEND_URL:http://localhost:5174}
app.instance-id=${INSTANCE_ID:}
app.runtime.queries.max-task-results=${QUERY_MAX_TASK_RESULTS:1000}
app.runtime.executors.document-index.core-size=${DOCUMENT_INDEX_CORE_SIZE:1}
app.runtime.executors.document-index.max-size=${DOCUMENT_INDEX_MAX_SIZE:2}
app.runtime.executors.document-index.queue-capacity=${DOCUMENT_INDEX_QUEUE_CAPACITY:100}
app.runtime.executors.document-index.keep-alive-seconds=${DOCUMENT_INDEX_KEEP_ALIVE_SECONDS:60}
app.runtime.executors.notification.core-size=${NOTIFICATION_CORE_SIZE:2}
app.runtime.executors.notification.max-size=${NOTIFICATION_MAX_SIZE:4}
app.runtime.executors.notification.queue-capacity=${NOTIFICATION_QUEUE_CAPACITY:500}
app.runtime.executors.notification.keep-alive-seconds=${NOTIFICATION_KEEP_ALIVE_SECONDS:60}
app.runtime.alerts.warning-percent=${RESOURCE_WARNING_PERCENT:75}
app.runtime.alerts.critical-percent=${RESOURCE_CRITICAL_PERCENT:90}
# Installer-created one-time UTF-8 file: username=, email=, name=, password= (one key=value per line).
app.bootstrap-admin.secret-file=${BOOTSTRAP_ADMIN_SECRET_FILE:}
app.environment=${APP_ENVIRONMENT:local}
app.mail.from=${MAIL_FROM:no-reply@b2bgearvia.local}
app.mail.enabled=${MAIL_ENABLED:false}
app.mail.verification-minutes=${MAIL_VERIFICATION_MINUTES:10}
app.mail.password-reset-minutes=${PASSWORD_RESET_MINUTES:30}
app.group.invitation-hours=${GROUP_INVITATION_HOURS:72}
app.notification.due-soon-cron=${NOTIFICATION_DUE_SOON_CRON:0 */15 * * * *}
app.notification.push.public-key=${VAPID_PUBLIC_KEY:}
app.notification.push.private-key=${VAPID_PRIVATE_KEY:}
app.notification.push.subject=${VAPID_SUBJECT:mailto:no-reply@b2bgearvia.local}
app.calendar.rejected-task-retention-hours=${CALENDAR_REJECTED_TASK_RETENTION_HOURS:24}
app.jwt.secret=${JWT_SECRET:local-development-secret-change-me-1234567890}
app.jwt.access-seconds=${JWT_ACCESS_SECONDS:3600}
app.jwt.refresh-seconds=${JWT_REFRESH_SECONDS:1209600}
app.jwt.pwa-refresh-idle-seconds=${JWT_PWA_REFRESH_IDLE_SECONDS:2592000}
app.jwt.pwa-refresh-absolute-seconds=${JWT_PWA_REFRESH_ABSOLUTE_SECONDS:7776000}
app.jwt.refresh-cleanup-ms=${JWT_REFRESH_CLEANUP_MS:86400000}
app.jwt.secure-cookie=${AUTH_SECURE_COOKIE:false}
app.security.rate-limit.enabled=${SECURITY_RATE_LIMIT_ENABLED:true}
app.security.rate-limit.attempts=${SECURITY_RATE_LIMIT_ATTEMPTS:10}
app.security.rate-limit.window-seconds=${SECURITY_RATE_LIMIT_WINDOW_SECONDS:60}
spring.servlet.multipart.max-file-size=${UPLOAD_MAX_FILE_SIZE:100MB}
spring.servlet.multipart.max-request-size=${UPLOAD_MAX_REQUEST_SIZE:101MB}
# Supported app.storage.provider values: local | nas_mount
app.storage.local-root=${UPLOAD_LOCAL_ROOT:/opt/b2bgearvia/data/uploads}
app.storage.provider=${STORAGE_PROVIDER:local}
# nas_mount treats a pre-mounted NAS/company storage-server path as a plain filesystem.
# Fixed path convention (matches infra/b2b/compose.yml's bind mount, inert when unused).
app.storage.nas-root=${STORAGE_NAS_ROOT:/opt/b2bgearvia/data/nas}
app.organization.chat.message-retention-days=${B2B_CHAT_MESSAGE_RETENTION_DAYS:365}
app.organization.chat.channel-limit=${B2B_CHAT_CHANNEL_LIMIT:50}
app.organization.storage.total-bytes=${B2B_GROUP_STORAGE_BYTES:5368709120}
app.organization.storage.attachment-limit-bytes=${B2B_ATTACHMENT_LIMIT_BYTES:104857600}
app.report.mail-cron=${REPORT_MAIL_CRON:0 0 8 * * *}
app.report.retry-cron=${REPORT_RETRY_CRON:0 20 * * * *}
app.admin.enabled=${ADMIN_ENABLED:false}
app.admin.allowed-ips=${ADMIN_ALLOWED_IPS:127.0.0.1,::1}
app.admin.trusted-proxies=${ADMIN_TRUSTED_PROXIES:127.0.0.1,::1}
app.admin.mfa-encryption-key-base64=${ADMIN_MFA_ENCRYPTION_KEY_BASE64:}
app.admin.frontend-url=${ADMIN_FRONTEND_URL:}
app.demo.enabled=${DEMO_ENABLED:true}
app.demo.username=${DEMO_USERNAME:demo_leader}
# Optional installer-managed file may provide OPENAI_API_KEY/AI_REPORT_ENABLED.
# Keep this file outside Git and backups; Responses store(false) is not Zero Data Retention.
app.ai-report.enabled=${AI_REPORT_ENABLED:false}
app.ai-report.api-key=${OPENAI_API_KEY:}
app.ai-report.model=${OPENAI_MODEL:gpt-5.6-luna}
app.ai-report.base-url=${OPENAI_BASE_URL:https://api.openai.com/v1}
app.ai-report.request-timeout=${OPENAI_REQUEST_TIMEOUT:45s}
app.ai-report.max-output-tokens=${OPENAI_MAX_OUTPUT_TOKENS:3000}
app.ai-report.prompt-version=v7-2-prompt-003
app.ai-assistant.enabled=${AI_ASSISTANT_ENABLED:false}
app.ai-assistant.model=${AI_ASSISTANT_MODEL:gpt-5.6-sol}
app.ai-assistant.request-timeout=${AI_ASSISTANT_REQUEST_TIMEOUT:30s}
app.ai-assistant.max-output-tokens=${AI_ASSISTANT_MAX_OUTPUT_TOKENS:800}
app.ai-assistant.message-retention-days=${AI_ASSISTANT_MESSAGE_RETENTION_DAYS:90}
app.ai-assistant.message-cleanup-cron=${AI_ASSISTANT_MESSAGE_CLEANUP_CRON:0 35 4 * * *}
app.ai-assistant.embedding-model=${AI_ASSISTANT_EMBEDDING_MODEL:text-embedding-3-small}
app.ai-assistant.auto-index-retry-cron=${AI_ASSISTANT_AUTO_INDEX_RETRY_CRON:0 */20 * * * *}
# Curated model allow-list shown to admins in the AI settings status view.
app.ai.supported-models=${AI_SUPPORTED_MODELS:gpt-5.6-sol,gpt-5.6-luna}
